<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{{APP_NAME}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: {{SPLASH_COLOR}};
    }
    #webview {
      width: 100%;
      height: 100%;
      border: none;
    }
    /* Safe area support for notched devices */
    @supports (padding-top: env(safe-area-inset-top)) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }
    /* Loading state */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: {{SPLASH_COLOR}};
      z-index: 1000;
      transition: opacity 0.3s ease;
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0,0,0,0.1);
      border-top-color: rgba(0,0,0,0.4);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="spinner"></div>
  </div>

  <iframe
    id="webview"
    src="{{APP_URL}}"
    allow="camera; microphone; geolocation; fullscreen; autoplay; encrypted-media"
    allowfullscreen
  ></iframe>

  <script src="https://unpkg.com/@capacitor/core@latest/dist/capacitor.js"></script>
  <script>
    // Wait for Capacitor to be ready
    document.addEventListener('DOMContentLoaded', function() {
      const iframe = document.getElementById('webview');
      const loading = document.getElementById('loading');

      // Hide loading when iframe is loaded
      iframe.addEventListener('load', function() {
        loading.classList.add('hidden');
      });

      // Handle iframe load errors
      iframe.addEventListener('error', function() {
        loading.innerHTML = '<p style="color: #666; font-size: 14px;">Erreur de chargement</p>';
      });

      // Communication bidirectionnelle avec le site web
      window.addEventListener('message', function(event) {
        // Sécurité: vérifier l'origine si nécessaire
        // if (event.origin !== '{{APP_URL_ORIGIN}}') return;

        if (event.data && event.data.type === 'session_token') {
          // Stocker le token via Capacitor Preferences
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
            window.Capacitor.Plugins.Preferences.set({
              key: 'session_token',
              value: event.data.token
            });
          }
        }

        // Forward message to Capacitor if needed
        if (event.data && event.data.type === 'capacitor_action') {
          handleCapacitorAction(event.data);
        }
      });

      function handleCapacitorAction(data) {
        switch(data.action) {
          case 'haptic':
            if (window.Capacitor && window.Capacitor.Plugins.Haptics) {
              window.Capacitor.Plugins.Haptics.impact({ style: 'light' });
            }
            break;
          case 'share':
            if (window.Capacitor && window.Capacitor.Plugins.Share) {
              window.Capacitor.Plugins.Share.share({
                title: data.title || '',
                text: data.text || '',
                url: data.url || ''
              });
            }
            break;
        }
      }

      // Handle back button on Android
      if (window.Capacitor && window.Capacitor.Plugins.App) {
        window.Capacitor.Plugins.App.addListener('backButton', function() {
          // Try to go back in iframe history, or exit app
          try {
            iframe.contentWindow.history.back();
          } catch(e) {
            window.Capacitor.Plugins.App.exitApp();
          }
        });
      }
    });
  </script>
</body>
</html>
